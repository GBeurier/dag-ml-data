name: release-crates

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run cargo publish --dry-run only"
        required: false
        default: "true"
      release_tag:
        description: "Immutable release tag to retry (required for a real manual publication)"
        required: false
        default: ""
      runner:
        description: "Hosted runner for a manual retry"
        type: choice
        options: [ubuntu-latest, ubuntu-22.04, macos-15-intel]
        default: ubuntu-latest
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish-crates:
    runs-on: ${{ inputs.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          fetch-depth: 0
      - name: Verify immutable manual release source
        if: github.event_name == 'workflow_dispatch' && inputs.release_tag != ''
        env:
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Expected a stable vX.Y.Z tag"; exit 1; }
          test "$(git rev-parse HEAD)" = "$(git rev-parse "refs/tags/${RELEASE_TAG}^{commit}")"
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Validate release metadata
        run: python scripts/validate_release_metadata.py

      - name: Validate publish plan
        run: python scripts/release/check_publish_plan.py

      - name: Publish workspace crates to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != 'false' && '1' || '' }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          INDEX_DELAY: ${{ github.event_name == 'workflow_dispatch' && inputs.runner == 'macos-15-intel' && '30' || '120' }}
        run: |
          set -euo pipefail
          args=(--sleep-seconds "$INDEX_DELAY")
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          elif [[ -n "${RELEASE_TAG}" ]]; then
            args+=(--tag "$RELEASE_TAG")
          fi
          if [[ -n "${DRY_RUN}" ]]; then
            args+=(--dry-run)
          elif [[ "${GITHUB_REF_TYPE:-}" != "tag" && -z "${RELEASE_TAG}" ]]; then
            echo "::error::non-dry-run publishing must run from a release tag"
            exit 1
          fi
          python scripts/release/publish_crates.py "${args[@]}"
