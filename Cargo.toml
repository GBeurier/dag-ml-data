[workspace]
resolver = "2"
members = [
    "crates/dag-ml-data-core",
    "crates/dag-ml-data",
    "crates/dag-ml-data-capi",
    "crates/dag-ml-data-cli",
    "crates/dag-ml-data-arrow",
    "crates/dag-ml-data-provider",
    "crates/dag-ml-data-py",
    "crates/dag-ml-data-wasm",
]
# The R (extendr) provider binding links against libR, so it is its own
# standalone package — kept out of the default workspace + publish gate. Build it
# with `cargo build --manifest-path crates/dag-ml-data-r/src/rust/Cargo.toml` or
# `R CMD INSTALL crates/dag-ml-data-r`.
exclude = ["crates/dag-ml-data-r"]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
authors = ["G. Beurier <beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/dag-ml-data"
homepage = "https://github.com/GBeurier/dag-ml-data"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "=4.5.53", features = ["derive"] }
dag-ml-data = { path = "crates/dag-ml-data", version = "0.1.0-alpha.0" }
dag-ml-data-arrow = { path = "crates/dag-ml-data-arrow", version = "0.1.0-alpha.0" }
dag-ml-data-core = { path = "crates/dag-ml-data-core", version = "0.1.0-alpha.0" }
dag-ml-data-provider = { path = "crates/dag-ml-data-provider", version = "0.1.0-alpha.0" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
pyo3 = "0.28.3"
wasm-bindgen = "0.2.122"
