[workspace]
resolver = "2"
members = [
    "crates/dag-ml-data-core",
    "crates/dag-ml-data",
    "crates/dag-ml-data-capi",
    "crates/dag-ml-data-cli",
    "crates/dag-ml-data-arrow",
]

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.82"
license = "MIT"
authors = ["G. Beurier <beurier@cirad.fr>"]
repository = "https://github.com/GBeurier/dag-ml-data"
homepage = "https://github.com/GBeurier/dag-ml-data"
readme = "README.md"

[workspace.dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
dag-ml-data = { path = "crates/dag-ml-data" }
dag-ml-data-core = { path = "crates/dag-ml-data-core" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
thiserror = "2.0"
