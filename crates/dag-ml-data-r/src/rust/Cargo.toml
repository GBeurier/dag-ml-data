[package]
name = "dag-ml-data-r"
version = "0.1.0-alpha.0"
edition = "2021"
rust-version = "1.83"
license = "MIT"
description = "R (extendr) provider bindings for dag-ml-data."
publish = false

[lib]
name = "dagmldata"
crate-type = ["staticlib", "lib"]

[[bin]]
name = "document"
path = "src/bin/document.rs"

[dependencies]
extendr-api = "0.9"
serde_json = "1.0"
dag-ml-data-core = { path = "../../../dag-ml-data-core" }
dag-ml-data-provider = { path = "../../../dag-ml-data-provider" }
