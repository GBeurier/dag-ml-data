#
# Accepted RustSec advisories for `cargo audit --deny warnings` (CI runs it on
# Cargo.lock and crates/dag-ml-data-py/Cargo.lock from the repository root).
# Everything not listed here stays denied. Each entry states why no update
# resolves it and when it must be removed.

[advisories]
ignore = [
    # RUSTSEC-2026-0543 "chrono is unmaintained" (informational, assigned
    # 2026-11-17, `patched = []`: no fixed chrono release exists, 0.4.45 is the
    # latest). It reports maintenance status, not a vulnerability. chrono is a
    # mandatory dependency of arrow-array up to its latest release (60.1.0),
    # used by dag-ml-data, dag-ml-data-arrow and dag-ml-data-capi; this
    # repository has no direct chrono dependency to replace. Remove when Arrow
    # resolves without chrono or the advisory is withdrawn. A chrono
    # vulnerability gets its own advisory identifier and is still denied.
    "RUSTSEC-2026-0543",
]
